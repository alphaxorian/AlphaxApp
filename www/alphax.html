<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PRIME PREDICTIONS</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- 320px x 390px Popup Bar -->
  <div class="prediction-popup">
    
    <!-- Red Top Header with X Button -->
    <div class="popup-header">
      <div class="header-brand">
        <!-- id="titleLogo" add kiya aur src khali chhod diya taaki broken icon na aaye -->
        <img id="titleLogo" src="" alt="alphaxWingo">
      </div>
      <button id="closePopupBtn" class="close-btn" title="Open popup.html">&times;</button>
    </div>

    <!-- Popup Inner Body -->
    <div class="popup-content">
      
      <!-- Top Card: Real IST Timer & Period -->
      <div class="border-card timer-box">
        <span class="timer-title">TIME REMAINING</span>
        <div class="timer-digits" id="countdownTimer">00:30</div>
        <div class="period-text">
          PERIOD: <span id="periodDisplay" class="gradient-period">Loading...</span>
        </div>
      </div>

      <!-- Bottom Card: 3 Balls Result (Side Small - Center Main - Side Small) -->
      <div class="border-card result-box">
        
        <div class="three-balls-container">
          <!-- Left Small Ball: src khali rakha hai, script.js isko extension URL dega -->
          <div class="ball-wrapper side-ball">
            <img id="ballLeft" src="" alt="ball">
          </div>

          <!-- Center Main Big Ball -->
          <div class="ball-wrapper center-ball">
            <img id="ballCenter" src="" alt="ball">
          </div>

          <!-- Right Small Ball -->
          <div class="ball-wrapper side-ball">
            <img id="ballRight" src="" alt="ball">
          </div>
        </div>

        <!-- Badges (SMALL/BIG + COLOR) -->
        <div class="badge-row">
          <div class="pill-btn orange-pill" id="sizeBadge">SMALL</div>
          <div class="pill-btn violet-pill" id="colorBadge">VIOLET</div>
        </div>

        <!-- Divider Line & Footer -->
        <div class="bottom-divider"></div>
        <p class="copyright-tag gradient-copyright">Copyright &copy;alphaxextensions.com</p>
      </div>

    </div>

  </div>

  <script src="script.js"></script>
</body>
</html>
